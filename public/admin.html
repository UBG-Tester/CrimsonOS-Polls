<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12070b"><title>Admin · Crimson OS Preferences</title><style>
:root{color-scheme:dark;--bg:#10070b;--panel:#1b0c12;--line:#49202e;--red:#e33355;--muted:#c19aa5;--text:#fff4f6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#32101c 0,transparent 48%),var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}.wrap{max-width:1150px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;margin-bottom:25px}.brand{font-weight:850;letter-spacing:-.03em}.brand span{color:var(--red)}a{color:#ff91a5;text-decoration:none}.panel{background:#1b0c12;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}.muted{color:var(--muted)}input,select{background:#10070b;color:white;border:1px solid var(--line);padding:11px;border-radius:9px;font:inherit;width:100%}.btn{background:linear-gradient(110deg,#a51635,#e33355);border:0;border-radius:9px;padding:11px 15px;color:white;font:inherit;font-weight:750;cursor:pointer}.secondary{background:#32121e;border:1px solid var(--line)}.row{display:flex;gap:10px}.row>*{flex:1}.status{color:#ff9caf;margin-top:10px;min-height:22px}.stats{font-size:28px;font-weight:850}.sub{border-top:1px solid var(--line);padding:15px 0}.sub:first-child{border-top:0}.subhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.name{font-weight:800;color:#ffc4cf}.date{font-size:12px;color:var(--muted)}.answer{margin-top:8px;padding:9px 11px;background:#12080d;border:1px solid #35131f;border-radius:8px}.answer b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#d6a5b1}.comment{white-space:pre-wrap;color:#f3dce2;margin-top:9px}.danger{background:#3a101a;border:1px solid #72253a;border-radius:8px;color:#ffc5d0;padding:6px 9px;cursor:pointer}#dashboard{display:none}.filters{margin:15px 0}.empty{color:var(--muted)}@media(max-width:650px){.row{flex-direction:column}}
</style></head><body><main class="wrap"><div class="top"><div><div class="brand"><span>CRIMSON</span> OS PREFERENCES / ADMIN</div><div class="muted">Review every submission and what the community said.</div></div><a href="/">← Back to polls</a></div><section id="login" class="panel"><h1>Admin sign-in</h1><p class="muted">This dashboard is password-protected.</p><form id="loginForm"><div class="row"><input id="password" type="password" autocomplete="current-password" placeholder="Admin password" required><button class="btn">Sign in</button></div><div id="loginStatus" class="status" role="status"></div></form></section><section id="dashboard"><div class="panel"><div class="top"><div><div class="muted">ALL SUBMISSIONS</div><div id="total" class="stats">0</div><div class="muted">Each entry includes the username, each poll answer, and any written comment.</div></div><button id="logout" class="btn secondary">Sign out</button></div><div class="row"><input id="search" placeholder="Filter by username, answer, or comment…"><select id="questionFilter"><option value="">All polls</option></select></div><div id="status" class="status"></div></div><div class="panel"><h2>Individual submissions</h2><div id="submissions"><p class="empty">Loading…</p></div></div></section></main><script>
let data={votes:[],questions:[]};const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
async function load(){const d=await api("/api/admin/submissions");data=d;document.getElementById("total").textContent=d.totalVotes;document.getElementById("questionFilter").innerHTML='<option value="">All polls</option>'+d.questions.map(q=>'<option value="'+esc(q.id)+'">'+esc(q.title)+'</option>').join("");document.getElementById("login").style.display="none";document.getElementById("dashboard").style.display="block";render()}
function render(){const term=document.getElementById("search").value.toLowerCase(),filter=document.getElementById("questionFilter").value;const votes=data.votes.filter(v=>{const blob=[v.username,v.comment,...Object.values(v.answers)].join(" ").toLowerCase();return blob.includes(term)&&(!filter||v.answers[filter])});document.getElementById("submissions").innerHTML=votes.length?votes.map(v=>'<article class="sub"><div class="subhead"><div><span class="name">'+esc(v.username||"Guest")+'</span> '+(v.anonymous?'<span class="muted">(anonymous)</span>':'')+'<div class="date">'+new Date(v.createdAt).toLocaleString()+'</div></div><button class="danger" data-delete="'+esc(v.id)+'">Delete</button></div>'+data.questions.filter(q=>v.answers[q.id]&&(!filter||q.id===filter)).map(q=>'<div class="answer"><b>'+esc(q.title)+'</b>'+esc(v.answers[q.id])+'</div>').join("")+(v.comment?'<div class="comment">“'+esc(v.comment)+'”</div>':"")+'</article>').join(""):'<p class="empty">No submissions match that filter.</p>'}
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const s=document.getElementById("loginStatus");s.textContent="Signing in…";try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:document.getElementById("password").value})});await load()}catch(err){s.textContent=err.message}});
document.getElementById("logout").addEventListener("click",async()=>{await api("/api/admin/logout",{method:"POST"});location.reload()});document.getElementById("search").addEventListener("input",render);document.getElementById("questionFilter").addEventListener("change",render);
document.getElementById("submissions").addEventListener("click",async e=>{const id=e.target.dataset.delete;if(!id)return;if(!confirm("Delete this submission permanently?"))return;try{await api("/api/admin/submissions/"+encodeURIComponent(id),{method:"DELETE"});await load()}catch(err){document.getElementById("status").textContent=err.message}});
load().catch(()=>{document.getElementById("login").style.display="block";document.getElementById("dashboard").style.display="none"});
</script></body></html>
